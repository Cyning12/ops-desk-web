name: deploy-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          if [ -z "$DEPLOY_HOST" ]; then echo "::error::缺少 Secret DEPLOY_HOST（服务器公网 IP 或域名）"; missing=1; fi
          if [ -z "$DEPLOY_USER" ]; then echo "::error::缺少 Secret DEPLOY_USER（如 ubuntu）"; missing=1; fi
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::缺少 Secret DEPLOY_SSH_KEY（无口令 deploy 私钥全文）"; missing=1; fi
          if [ "$missing" != "0" ]; then
            echo "::error::请按 docs/deployment/gha-frontend-deploy.md 配置 Secrets 后重跑 workflow_dispatch"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Rsync dist to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/ops-desk/web/dist}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p \"\$(dirname '$DEPLOY_PATH')\" && if [ -d '$DEPLOY_PATH' ]; then mv '$DEPLOY_PATH' '${DEPLOY_PATH}.bak.'\$(date +%Y%m%d%H%M%S); fi"
          rsync -az --delete \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i $HOME/.ssh/id_ed25519" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          echo "Deployed dist/ -> $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
