# symbol → path 倒排（G-L2 · 多域：chat + lg_rag）
# 源：l1/10_flow_chat.graph.yaml · l1/10_flow_lg_rag.graph.yaml 的 implementedBy
# 键决策（R1-N6 · 30 内决 2026-08-31）：本波 chat/lg_rag 两域 18 键零撞键（已核），
#   维持裸符号键；后续域扩展若遇泛名撞键（如 invoke/abort/http），改 path#symbol 复合键。

version: "2026-08-31"
graph_ids: ["10_flow_chat", "10_flow_lg_rag"]
