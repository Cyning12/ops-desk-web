# symbol → path 倒排（G-L2 · 多域：chat + lg_rag + overview/issues/pulls/graph/lc_evidence/obs/login）
# 源：l1/10_flow_*.graph.yaml（9 个）的 implementedBy
# 键决策（R1-N6 · 30 内决 2026-08-31）：chat/lg_rag 两域 18 键零撞键，维持裸符号键；
#   后续域扩展若遇泛名撞键（如 invoke/abort/http），改 path#symbol 复合键。
# 双形态决策（R1-N1 · 2026-08-31 P1b task_web_graph_l1_flow_pages）：
#   泛名撞键必然触发（load×5 · invoke/abort 撞 lg_rag 既有键 · setPage/setPageSize 互撞），
#   本波 7 域新条目一律 `path#symbol` 复合键；既有 chat/lg_rag 裸键条目不迁移，两形态并存。
#   例外（30 内决）：http 符号 9 个 flow 复用同一节点（path/symbol/node_id=http_client 全同），
#   既有裸键 `http` 单条即可全域命中，不新增复合键重复条目。

version: "2026-08-31"
graph_ids: ["10_flow_chat", "10_flow_lg_rag", "10_flow_overview", "10_flow_issues", "10_flow_pulls", "10_flow_graph", "10_flow_lc_evidence", "10_flow_obs", "10_flow_login"]
layer: "G-L2"

