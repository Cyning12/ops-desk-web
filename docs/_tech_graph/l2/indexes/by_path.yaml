      symbol: useLgRagStore
      kind: module
    - node_id: invoke_action
      symbol: invoke
      kind: method
    - node_id: abort_action
      symbol: abort
      kind: method
    - node_id: use_thread_id
      symbol: useThreadId
      kind: method
    - node_id: elapsed_timer
      symbol: elapsedSeconds
      kind: state
  "src/api/lgRag.ts":
    - node_id: invoke_api
      symbol: invokeLgRag
      kind: method
    - node_id: invoke_path
      symbol: LG_RAG_INVOKE_PATH
      kind: const
  # ── 共享（全部 9 个 flow 复用同一 http 实例 · 各 flow node_id 同为 http_client）──
  "src/api/http.ts":
    - node_id: http_client
      symbol: http
      kind: module
  # ── overview 域（10_flow_overview）──
