# path → 节点倒排（G-L2 · 多域：chat + lg_rag + overview/issues/pulls/graph/lc_evidence/obs/login）
# 源：l1/10_flow_*.graph.yaml（9 个）的 implementedBy
# 生成策略：手维启动；后续可 --check
# 形态决策（R1-N3 · 30 内决 2026-08-31）：同文件多域分段（不拆分 *_lg_rag 文件对）；
#   graph_id 单值升级为 graph_ids 列表承接多域；按域分段注释。
# 2026-08-31 P1b（task_web_graph_l1_flow_pages）：新增 7 域分段；
#   src/api/http.ts 的 http_client 节点被 7 个 flow 复用（node_id 同；chat flow 无该节点 ·
#   obs fixture 驱动无 http 段 · 计数口径同 by_symbol 头注 R1-N1 校正：7 非 9），单列「共享」段不重复。
# 键形态约定（2026-08-31 P2 · task_web_graph_l2_key_unify）：本表键即 path（天然复合定位，不动）；
#   by_symbol.yaml 已统一为 `path#symbol` 复合键单形态，两表键形态约定对齐。

version: "2026-08-31"
graph_ids: ["10_flow_chat", "10_flow_lg_rag", "10_flow_overview", "10_flow_issues", "10_flow_pulls", "10_flow_graph", "10_flow_lc_evidence", "10_flow_obs", "10_flow_login"]
layer: "G-L2"

by_path:
  # ── chat 域（10_flow_chat）──
  "src/views/ChatView.vue":
    - node_id: chat_view
      symbol: ChatView
      kind: component
  "src/stores/chat.ts":
    - node_id: chat_store
      symbol: useChatStore
      kind: module
    - node_id: load_session
      symbol: loadLatestSession
      kind: method
    - node_id: send_message
      symbol: sendMessage
      kind: method
    - node_id: resume_from_cursor
      symbol: resumeFromCursor
      kind: method
  "src/api/chat.ts":
    - node_id: fetch_session_api
      symbol: fetchLatestSession
      kind: method
  "src/composables/useLgRagSse.ts":
    - node_id: stream_sse
      symbol: streamLgRag
      kind: method
    - node_id: replay_sse
      symbol: replayLgRag
      kind: method
    - node_id: sse_parser
      symbol: LgRagSseFrameParser
      kind: class
  # ── lg_rag 域（10_flow_lg_rag）──
  "src/views/LgRagView.vue":
