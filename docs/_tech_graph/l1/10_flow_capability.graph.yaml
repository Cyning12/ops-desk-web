schema_version: "inform_graph.v3"
graph_id: "10_flow_capability"
title: "Capability 目录页加载流程（前端 · T-W3 · task_web_capability_catalog）"
description: "用户打开目录页（/capability）：router ensureMe 守卫 → CapabilityCatalogView onMounted → useCapabilityStore.load → api/capability.fetchCapabilityMine → api/http axios → GET /api/ops/capability/mine → ops_api（九键白名单投影 · 排除 adapter/args_schema · {items,count} 照登）。role=maintainer 时另走 fetchAdminCapabilityCatalog → GET /api/ops/admin/capability/catalog（只取顶层两键 manifest_errors/manifest_error_details 渲染故障详情）；普通用户零探测面（菜单/路由/请求三级均不见 maintainer 信息 · 不请求 admin 端点）。旁注：①权限口径 cookie 会话 + /auth/me role 驱动显隐，非前端硬编码账号；②空集（items=[]）/ 故障态（manifest_errors 非空）/ 加载态三态渲染；③401 由 http 全局拦截器跳登录（复用既有）；④响应体 snake_case 原始体照登，字段级真值以 /openapi.json + 端点实际行为为准（FP-1）。"
version: "2026-10-11"
layer: "G-L1"
primary_layer: "G-L1"
depth: "method"
direction: "TB"

nodes:
  - id: "user"
    label: "用户"
    kind: external

  - id: "router_guard"
    label: "router（/capability · ensureMe 守卫）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/router/index.ts"
      symbol: "router"

  - id: "capability_view"
    label: "CapabilityCatalogView"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/views/CapabilityCatalogView.vue"
      symbol: "CapabilityCatalogView"

  - id: "capability_store"
    label: "useCapabilityStore"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/capability.ts"
      symbol: "useCapabilityStore"

  - id: "load_action"
    label: "load"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/capability.ts"
      symbol: "load"

  - id: "fetch_mine_api"
    label: "fetchCapabilityMine"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/api/capability.ts"
      symbol: "fetchCapabilityMine"

  - id: "fetch_catalog_api"
    label: "fetchAdminCapabilityCatalog"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/api/capability.ts"
      symbol: "fetchAdminCapabilityCatalog"

  - id: "http_client"
    label: "http（axios · baseURL=/api）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/api/http.ts"
      symbol: "http"

  - id: "ops_api"
    label: "ops-desk-api"
    kind: external

edges:
  - from: "user"
    to: "router_guard"
    label: "opens /capability"

  - from: "router_guard"
    to: "capability_view"
    label: "ensureMe 守卫复用（401 跳登录）"

  - from: "capability_view"
    to: "capability_store"
    label: "binds"

  - from: "capability_view"
    to: "load_action"
    label: "onMounted"

  - from: "load_action"
    to: "fetch_mine_api"
    label: "await（空集 items=[] 渲染空态）"

  - from: "fetch_mine_api"
    to: "http_client"
    label: "http.get('/ops/capability/mine')（九键投影 · {items,count}）"

  - from: "load_action"
    to: "fetch_catalog_api"
    label: "role=maintainer 才调（/auth/me role 驱动 · 普通用户零探测面不请求）"

  - from: "fetch_catalog_api"
    to: "http_client"
    label: "http.get('/ops/admin/capability/catalog')（只取顶层两键 manifest_errors/manifest_error_details）"

  - from: "http_client"
    to: "ops_api"
    label: "GET /api/ops/capability/mine · GET /api/ops/admin/capability/catalog"
