schema_version: "inform_graph.v3"
graph_id: "10_flow_chat"
title: "Chat 流式对话流程（前端）"
description: "用户在 Chat 页发送消息：ChatView → chat store → useLgRagSse → POST /api/ops/lg-rag/stream（freeze lg-rag-sse-v1 · 2026-08-31 起主 Chat 切 lg-rag SSE，废弃 chat stream 主路径）；会话元数据走 axios fetchLatestSession（T2 保留门控，非 lg-rag SoT）。T3（2026-08-31）thread_id 会话连续性：客户端不自生成；首轮留空 → api 生成 → run.start payload 捕获；localStorage 持久化（key ops.lg-rag.thread-id，不可用则内存态降级）；刷新/重进恢复后端上下文（不回显历史消息，顶部提示条）；401/登出清除；已存 id 遇 404/422 清本地 id + 提示、不自动重发；startNewSession() 开新会话。"
version: "2026-08-31"
layer: "G-L1"
primary_layer: "G-L1"
depth: "method"
direction: "TB"

nodes:
  - id: "user"
    label: "用户"
    kind: external

  - id: "chat_view"
    label: "ChatView"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "src/views/ChatView.vue"
        symbol: "ChatView"
        kind: component

  - id: "chat_store"
    label: "useChatStore"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "src/stores/chat.ts"
        symbol: "useChatStore"
        kind: module

  - id: "load_session"
    label: "loadLatestSession"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "src/stores/chat.ts"
        symbol: "loadLatestSession"
        kind: method

  - id: "send_message"
    label: "sendMessage"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "src/stores/chat.ts"
        symbol: "sendMessage"
        kind: method

  - id: "fetch_session_api"
    label: "fetchLatestSession"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "src/api/chat.ts"
