        symbol: "streamLgRag"
        kind: method

  - id: "sse_parser"
    label: "LgRagSseFrameParser"
    kind: struct
    layer_hint: "G-L2"
    implementedBy:
      - path: "src/composables/useLgRagSse.ts"
        symbol: "LgRagSseFrameParser"
        kind: class

  - id: "ops_api"
    label: "ops-desk-api"
    kind: external

  - id: "api_chat_flow"
    label: ">../../../ops-desk-api/docs/_tech_graph/l1/10_flow_chat.md"
    kind: external

edges:
  - from: "user"
    to: "chat_view"
    label: "opens /chat"

  - from: "chat_view"
    to: "chat_store"
    label: "binds"

  - from: "chat_view"
    to: "load_session"
    label: "onMounted"

  - from: "load_session"
