schema_version: "inform_graph.v3"
graph_id: "10_flow_graph"
title: "Graph 图谱快照页加载流程（前端）"
description: "用户打开图谱页（/graph）：GraphView onMounted → useGraphStore.load → api/graph.fetchGraph → api/http axios → GET /api/ops/graph → ops_api。旁注：① 全 null 响应（无快照时后端实测 {snapshot:null, module_matrix:null, repo_id:null, created_at:null}）是正常数据态，不视为错误（api 头注 L7–8 · store 头注 L13）；module_matrix 结构未知按防御性渲染（类型宽松 unknown · api L10–17）；② load() 幂等防重入（store L23），loaded 标记是否成功加载过（store L20/L28）；③ 失败写 ApiError 供页面 el-alert + 重试（store L29–33 · view L98），「刷新」按钮同走 load（view L87）；④ store 另有 reset()（L37–42）清空三态，当前页未挂触发点，不入链。"
version: "2026-08-31"
layer: "G-L1"
primary_layer: "G-L1"
depth: "method"
direction: "TB"

nodes:
  - id: "user"
    label: "用户"
    kind: external

  - id: "graph_view"
    label: "GraphView"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/views/GraphView.vue"
      symbol: "GraphView"

  - id: "graph_store"
    label: "useGraphStore"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/graph.ts"
      symbol: "useGraphStore"

  - id: "load_action"
    label: "load"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/graph.ts"
      symbol: "load"

  - id: "fetch_graph_api"
    label: "fetchGraph"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/api/graph.ts"
      symbol: "fetchGraph"

  - id: "http_client"
    label: "http（axios · baseURL=/api）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/api/http.ts"
      symbol: "http"

  - id: "ops_api"
    label: "ops-desk-api"
    kind: external

edges:
  - from: "user"
    to: "graph_view"
    label: "opens /graph"

  - from: "graph_view"
    to: "graph_store"
    label: "binds"

  - from: "graph_view"
    to: "load_action"
    label: "onMounted（L8–9）· 刷新（L87）/ 重试（L98）click"

  - from: "load_action"
    to: "fetch_graph_api"
    label: "await（幂等防重入 · L23/L27）"

  - from: "fetch_graph_api"
    to: "http_client"
    label: "http.get('/ops/graph')（L26）"

  - from: "http_client"
    to: "ops_api"
    label: "GET /api/ops/graph"
