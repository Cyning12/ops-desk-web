schema_version: "inform_graph.v3"
graph_id: "10_flow_pulls"
title: "Pull Requests 列表页查询流程（前端）"
description: "用户打开 PR 页（/pulls）：PullsView onMounted → usePullsStore.load → buildParams 拼装参数 → api/pulls.fetchPulls → api/http axios → GET /api/ops/pulls → ops_api。旁注：① 筛选即改即查——setFilter 变更 state/ci_status 直接 page=1 重新请求（store L59–64 · view el-select L47/L56），选项来自可配置常量 PULL_STATE_OPTIONS（open/closed/merged · api L33）与 PULL_CI_STATUS_OPTIONS（success/failure/pending · api L36 · view L49/L58 渲染）；② setPage/setPageSize 与当前值相同则直接返回不重打（store L66–77）；③ 空值筛选参数拼装时剔除（buildParams store L33–38 · api 头注 L38）；④ 错误态清空 items/total 并写 error，「重试」走 retry → load（store L50–53/L80–82 · view L70）。"
version: "2026-08-31"
layer: "G-L1"
primary_layer: "G-L1"
depth: "method"
direction: "TB"

