schema_version: "inform_graph.v3"
graph_id: "10_flow_lg_rag"
title: "LG RAG 旁路 invoke 流程（前端）"
description: "用户在 LG RAG 旁路实验页（/lg-rag）提交 query：LgRagView → useLgRagStore.invoke → api/lgRag.invokeLgRag → api/http axios → POST /api/ops/lg-rag/invoke → ops_api。旁注：① route=refuse / gate_action=refuse 为 200 成功态（lgRag.ts L141 · store L15 · view isRefuse L19–23 三处互证），写入 result 而非 error；② 非流式（freeze lg-rag-http-v1 · lgRag.ts L139），SSE 主线在 10_flow_chat 不重复建模；③ thread_id 续写回填：「用此 thread_id 继续」把响应 result.thread_id 回填输入框（store useThreadId L42–44 · 进程内有效），invoke 时非空 thread_id 入请求体（store L64–65）；④ mode 三档 router / basic / supervisor（lgRag.ts L13 LgRagMode）；⑤ 单次超时 300s 落在 invokeLgRag 请求 config（LG_RAG_TIMEOUT_MS L6 · L152），不改 http 全局 30s；⑥ 404/502 统一文案「旁路 API 不可用」（mapLgRagError L106–116）；取消（abort/新 invoke 抢占）不写 error（isCanceledError L85–93 · store L70–72）；elapsedSeconds 为 loading 期间秒计时（store L25 声明 · L59–61 setInterval · finally 停表）。"
