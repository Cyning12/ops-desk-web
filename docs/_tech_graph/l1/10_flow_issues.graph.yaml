schema_version: "inform_graph.v3"
graph_id: "10_flow_issues"
title: "Issues 列表页查询流程（前端）"
description: "用户打开 Issues 页（/issues）：IssuesView onMounted → useIssuesStore.load → buildIssueParams 拼装参数 → api/issues.fetchIssues → api/http axios → GET /api/ops/issues → ops_api。旁注：① 筛选表单是草稿态，点「查询」才 applyFilters（部分更新 + page 重置 1 重新请求 · store L67–71 · view L19–23）；resetFilters 全量重置（store L74–78）；setPage/setPageSize 分页切换重新请求（pageSize 变更同重置 page=1 · store L81–91）；② 空字符串/undefined 筛选参数不拼进 query（api L39–46 · buildIssueParams 纯函数 store L21–32）；③ 后端按 updated_at desc 固定排序，前端不做排序（api 头注 L6）；④ 请求失败不抛异常，写 error 供 el-alert + 重试（store L59–63 · view L100）。"
version: "2026-08-31"
layer: "G-L1"
primary_layer: "G-L1"
depth: "method"
direction: "TB"

nodes:
  - id: "user"
    label: "用户"
    kind: external

  - id: "issues_view"
    label: "IssuesView"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/views/IssuesView.vue"
      symbol: "IssuesView"

  - id: "issues_store"
    label: "useIssuesStore"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/issues.ts"
      symbol: "useIssuesStore"

  - id: "load_action"
    label: "load"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/issues.ts"
      symbol: "load"

  - id: "apply_filters"
    label: "applyFilters"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/issues.ts"
      symbol: "applyFilters"

  - id: "reset_filters"
    label: "resetFilters"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/issues.ts"
      symbol: "resetFilters"

  - id: "set_page"
    label: "setPage"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/issues.ts"
      symbol: "setPage"

  - id: "set_page_size"
    label: "setPageSize"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/issues.ts"
      symbol: "setPageSize"

  - id: "build_issue_params"
    label: "buildIssueParams"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/stores/issues.ts"
      symbol: "buildIssueParams"

  - id: "fetch_issues_api"
    label: "fetchIssues"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/api/issues.ts"
      symbol: "fetchIssues"

  - id: "http_client"
    label: "http（axios · baseURL=/api）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "src/api/http.ts"
      symbol: "http"

  - id: "ops_api"
    label: "ops-desk-api"
    kind: external

edges:
  - from: "user"
    to: "issues_view"
    label: "opens /issues"

  - from: "issues_view"
    to: "issues_store"
    label: "binds"

  - from: "issues_view"
    to: "load_action"
    label: "onMounted（L50–51）· 重试 click（L100）"

  - from: "issues_view"
    to: "apply_filters"
    label: "查询 click（草稿入筛选 · L23）"

  - from: "issues_view"
    to: "reset_filters"
    label: "重置 click（L28）"

  - from: "issues_view"
    to: "set_page"
    label: "翻页（L32）"

  - from: "issues_view"
    to: "set_page_size"
    label: "每页条数变更（L36）"

  - from: "apply_filters"
    to: "load_action"
    label: "page=1 重新请求（L67–71）"

  - from: "reset_filters"
    to: "load_action"
    label: "page=1 重新请求（L74–78）"

  - from: "set_page"
    to: "load_action"
    label: "重新请求（L81–84）"

  - from: "set_page_size"
    to: "load_action"
    label: "page=1 重新请求（L87–91）"

  - from: "load_action"
    to: "build_issue_params"
    label: "拼装筛选+分页参数（L54）"

  - from: "build_issue_params"
    to: "fetch_issues_api"
    label: "FetchIssuesParams"

  - from: "fetch_issues_api"
    to: "http_client"
    label: "http.get('/ops/issues', {params})（L47 · 空值不拼 query L39–46）"

  - from: "http_client"
    to: "ops_api"
    label: "GET /api/ops/issues"
