schema_version: "inform_graph.v3"
graph_id: "10_flow_login"
title: "Login 登录 / 登出流程（前端）"
description: "用户在登录页（/login）提交用户名 + 邀请密钥：LoginView → useAuthStore.login → api/auth.login → api/http axios → POST /api/ops/auth/login → ops_api；登出由 AppLayout 触发：useAuthStore.logout → api/auth.logout → POST /api/ops/auth/logout。旁注：① 会话为 HttpOnly cookie（ops_session · 成功时后端 Set-Cookie 写入，api L17），前端不接触 token；② login 请求自身的 401（凭证错误）交给表单展示，不触发全局跳转（http.ts L65–67）；③ 登出请求失败也忽略——本地登出语义永远成立，finally 必 clearSession（store L48–56）；clearSession 同步清 lg-rag thread_id / active-run 本地持久化，防换账号串号（store L59–71）；④ 路由守卫联动：beforeEach 首导航 await ensureMe 会话探测（401=未登录缓存结论 · store L23–41 · router/index.ts L88–100），未登录跳 /login?redirect=<原路径>、已登录访 /login 回 /overview；http 401 拦截经 setUnauthorizedHandler 注册回调 → clearSession + 跳登录（router/index.ts L107–114）；⑤ 登录成功 router.push 回 redirect 或 /overview（view L28–30）。"
version: "2026-08-31"
layer: "G-L1"
primary_layer: "G-L1"
depth: "method"
direction: "TB"

